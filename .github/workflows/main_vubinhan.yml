name: Build and deploy Fullstack App to Azure Web App - vubinhan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: ⚛️ Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: ⚛️ Build frontend React App
        working-directory: ./frontend
        run: npm run build

      - name: 🔁 Move React build into backend/frontend/
        run: |
          rm -rf backend/frontend
          mkdir -p backend/frontend
          cp -r frontend/build/* backend/frontend/

      - name: 📦 Install backend production dependencies only
        working-directory: ./backend
        run: npm install --omit=dev

      - name: 📦 Zip full backend (with React build)
        run: |
          cd backend
          zip -r ../release.zip .

      - name: ⬆️ Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: fullstack-app

      - name: 📂 Unzip artifact
        run: unzip release.zip

      - name: 💤 Wait before deployment (fix SCM container restart)
        run: sleep 30

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'vubinhan'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F9E14196389F4D25B67BB724E4918957 }}
